name: OrangeFox Recovery Cloud Build

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Ulefone Vendor Boot Image
        uses: marketplace/actions/orangefox-recovery-builder-action@main
        env:
          MANIFEST_URL: "https://gitlab.com"
          MANIFEST_BRANCH: "12.1"
          DEVICE_TREE: "https://github.com"
          DEVICE_TREE_BRANCH: "main"
          DEVICE_PATH: "device/ulefone/armor_x13"
          DEVICE_NAME: "armor_x13"
          BUILD_TARGET: "vendorbootimage"
